<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obstacle Reversi</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f0e8;
      --ink: #191b1f;
      --muted: #626a73;
      --panel: #ffffff;
      --line: #c9c2b6;
      --board-a: #217756;
      --board-b: #1b684d;
      --accent: #c9452f;
      --obstacle: #755135;
      --legal: #f5c84c;
      --shadow: 0 18px 48px rgba(25, 27, 31, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 320px;
      gap: 24px;
      align-items: center;
    }

    .play-area {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .board-shell {
      width: min(82vmin, 720px);
      aspect-ratio: 1;
      padding: 10px;
      background: #12221b;
      box-shadow: var(--shadow);
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-auto-rows: 1fr;
      border: 2px solid #101612;
      background: #101612;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.42);
      background: var(--board-a);
      color: inherit;
      cursor: default;
      appearance: none;
      -webkit-appearance: none;
    }

    .cell.alt {
      background: var(--board-b);
    }

    .cell.legal {
      cursor: pointer;
    }

    .cell.legal::after {
      content: "";
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--legal);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.26);
      opacity: 0.95;
    }

    .disc {
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: inset 0 5px 10px rgba(255, 255, 255, 0.2),
        inset 0 -8px 16px rgba(0, 0, 0, 0.22),
        0 5px 12px rgba(0, 0, 0, 0.25);
    }

    .disc.black {
      background: #17181b;
      border: 2px solid #050607;
    }

    .disc.white {
      background: #f7f4ea;
      border: 2px solid #d3cabb;
    }

    .obstacle {
      width: 76%;
      height: 76%;
      background: var(--obstacle);
      border: 2px solid rgba(0, 0, 0, 0.34);
      position: relative;
    }

    .obstacle::before,
    .obstacle::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 3px;
      background: rgba(30, 18, 10, 0.62);
    }

    .obstacle::before {
      transform: rotate(45deg);
    }

    .obstacle::after {
      transform: rotate(-45deg);
    }

    aside {
      min-height: 420px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(25, 27, 31, 0.08);
      display: grid;
      align-content: start;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
    }

    .status {
      min-height: 54px;
      display: grid;
      align-content: center;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 16px;
      line-height: 1.35;
    }

    .status.game-over {
      padding: 14px 16px;
      border: 1px solid #1d2329;
      background: #1d2329;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    .score {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-box {
      border: 1px solid var(--line);
      padding: 12px;
      min-width: 0;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .value {
      display: block;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .turn-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: -1px;
      background: #17181b;
      border: 1px solid #050607;
    }

    .turn-dot.white {
      background: #f7f4ea;
      border-color: #bdb4a6;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 1px solid #1d2329;
      background: #1d2329;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .error {
      min-height: 22px;
      color: var(--accent);
      font-size: 14px;
      line-height: 1.35;
    }

    @media (max-width: 820px) {
      main {
        min-height: auto;
        grid-template-columns: 1fr;
        align-items: start;
        padding: 16px;
      }

      aside {
        min-height: 0;
        order: -1;
      }

      .board-shell {
        width: min(94vmin, 680px);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="play-area" aria-label="Game board">
      <div class="board-shell">
        <div id="board"></div>
      </div>
    </section>

    <aside>
      <h1>Obstacle Reversi</h1>
      <div id="status" class="status">Starting...</div>

      <div class="score">
        <div class="score-box">
          <span class="label">Black</span>
          <span id="blackScore" class="value">2</span>
        </div>
        <div class="score-box">
          <span class="label">White</span>
          <span id="whiteScore" class="value">2</span>
        </div>
      </div>

      <div class="actions">
        <button id="newGame" type="button">New Game</button>
        <button id="passTurn" class="secondary" type="button" disabled>Pass</button>
      </div>
      <div id="error" class="error" aria-live="polite"></div>
    </aside>
  </main>

  <script>
    const boardEl = document.querySelector("#board");
    const statusEl = document.querySelector("#status");
    const errorEl = document.querySelector("#error");
    const blackScoreEl = document.querySelector("#blackScore");
    const whiteScoreEl = document.querySelector("#whiteScore");
    const newGameBtn = document.querySelector("#newGame");
    const passBtn = document.querySelector("#passTurn");

    let state = null;
    let busy = false;

    const apiBase = window.location.protocol === "file:"
      ? "http://127.0.0.1:8000"
      : "";

    const playerName = (player) => (player === -1 ? "Black" : "White");
    const isHumanTurn = () => state && state.current_player !== state.ai_player;

    async function requestJson(url, options = {}) {
      const response = await fetch(`${apiBase}${url}`, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.detail || `Request failed: ${response.status}`);
      }
      return payload;
    }

    function legalSet() {
      return new Set((state?.legal_moves || []).map(([r, c]) => `${r},${c}`));
    }

    function render() {
      if (!state) return;

      const n = state.board.length;
      const legal = legalSet();
      boardEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;
      boardEl.textContent = "";

      state.board.forEach((row, r) => {
        row.forEach((value, c) => {
          const cell = document.createElement("button");
          const moveKey = `${r},${c}`;
          cell.type = "button";
          cell.className = `cell ${(r + c) % 2 ? "alt" : ""}`;
          cell.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
          cell.disabled = busy || state.game_over || !isHumanTurn() || !legal.has(moveKey);
          if (legal.has(moveKey) && isHumanTurn() && value === 0) {
            cell.classList.add("legal");
            cell.addEventListener("click", () => humanMove(r, c));
          }

          if (value === -1 || value === 1) {
            const disc = document.createElement("span");
            disc.className = `disc ${value === -1 ? "black" : "white"}`;
            cell.appendChild(disc);
          } else if (value === 2) {
            const obstacle = document.createElement("span");
            obstacle.className = "obstacle";
            cell.appendChild(obstacle);
          }

          boardEl.appendChild(cell);
        });
      });

      blackScoreEl.textContent = state.score.black;
      whiteScoreEl.textContent = state.score.white;
      passBtn.disabled = busy || state.game_over || !isHumanTurn() || state.legal_moves.length > 0;
      statusEl.classList.toggle("game-over", state.game_over);

      if (state.game_over) {
        const diff = Math.abs(state.score.black - state.score.white);
        const result = state.winner === 0
          ? "Draw"
          : `${playerName(state.winner)} wins by ${diff}`;
        statusEl.textContent = `Game Over - ${result}`;
      } else if (busy && state.current_player === state.ai_player) {
        statusEl.textContent = "AI thinking...";
      } else if (isHumanTurn() && state.legal_moves.length === 0) {
        statusEl.textContent = `${playerName(state.current_player)} has no legal moves - Pass`;
      } else {
        const dot = `<span class="turn-dot ${state.current_player === 1 ? "white" : ""}"></span>`;
        statusEl.innerHTML = `${dot}${playerName(state.current_player)} to move`;
      }
    }

    async function syncAiTurn() {
      if (!state || state.game_over || state.current_player !== state.ai_player) {
        return;
      }
      busy = true;
      errorEl.textContent = "";
      render();
      try {
        state = await requestJson("/api/ai_move", {
          method: "POST",
          body: JSON.stringify({ session_id: state.session_id }),
        });
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        busy = false;
        render();
      }
    }

    async function humanMove(r, c) {
      if (!state || busy || !isHumanTurn()) return;
      busy = true;
      errorEl.textContent = "";
      render();
      try {
        state = await requestJson("/api/human_move", {
          method: "POST",
          body: JSON.stringify({ session_id: state.session_id, x: r, y: c }),
        });
        render();
        await syncAiTurn();
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        busy = false;
        render();
      }
    }

    async function passTurn() {
      if (!state || busy || !isHumanTurn() || state.legal_moves.length > 0) return;
      busy = true;
      errorEl.textContent = "";
      render();
      try {
        state = await requestJson("/api/human_pass", {
          method: "POST",
          body: JSON.stringify({ session_id: state.session_id }),
        });
        render();
        await syncAiTurn();
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        busy = false;
        render();
      }
    }

    async function newGame() {
      busy = true;
      errorEl.textContent = "";
      render();
      try {
        state = await requestJson("/api/new_game");
        render();
        await syncAiTurn();
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        busy = false;
        render();
      }
    }

    newGameBtn.addEventListener("click", newGame);
    passBtn.addEventListener("click", passTurn);
    newGame();
  </script>
</body>
</html>
